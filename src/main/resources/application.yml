spring:
  application:
    name: univ-sitdown
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://sitdown.bond,https://www.sitdown.bond,http://sitdown.bond,http://www.sitdown.bond}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET:univ-sitdown-local-development-secret-key-min-32-chars-long}
  access-token-expiry-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: univ-sitdown
    version: 0.0.1
